[pytest]
testpaths = tests
filterwarnings =
    # Surface anything new by default.
    default
    # The library calls plt.show(); under the Agg backend used in tests there is nothing to show.
    # This is a property of running headless, not of the code.
    ignore:FigureCanvasAgg is non-interactive:UserWarning
    # pyplot keeps a registry of open figures; the report functions legitimately open many and
    # the autouse fixture in conftest closes them after each test.
    ignore:More than 20 figures have been opened:RuntimeWarning
    # shap announces a change in how it returns values for LightGBM binary classifiers.
    # Informational, raised by the dependency, nothing to fix here.
    ignore:LightGBM binary classifier with TreeExplainer:UserWarning
    # seaborn passes vert= to matplotlib's boxplot internally; the deprecation is in the
    # dependency, not in oleda, and nothing here can change the call.
    ignore:vert
